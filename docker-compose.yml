# Local AWS emulator for Gatehold development and failure tests.
# https://github.com/ministackorg/ministack
#
# Start:  docker compose up -d
# Health: curl http://localhost:4566/_ministack/health
# Reset:  curl -X POST http://localhost:4566/_ministack/reset
# UI:     http://localhost:8080  (StackPort — DynamoDB browser, not a second DB)

services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    environment:
      - MINISTACK_REGION=us-east-1
      - MINISTACK_ACCOUNT_ID=000000000000
      # docker = run Lambdas in containers (needed for non-Python runtimes)
      - LAMBDA_EXECUTOR=docker
      - LOG_LEVEL=INFO
    volumes:
      # Required so MiniStack can start Lambda containers
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # DynamoDB UI (and other AWS service browsers) — StackPort
  # https://stackport.cloud/docs/guides/ministack/
  #
  # This is NOT a second DynamoDB. MiniStack already provides DynamoDB on :4566.
  # StackPort is only a web console that reads/writes that same emulator.
  # Open: http://localhost:8080 → DynamoDB → gatehold-dev-seats / gatehold-dev-events
  # ---------------------------------------------------------------------------
  stackport:
    image: davireis/stackport:latest
    ports:
      - "8080:8080"
    environment:
      # Point at the MiniStack service on the compose network (same DynamoDB)
      - AWS_ENDPOINT_URL=http://ministack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      # Faster startup: only probe services we use locally
      - STACKPORT_SERVICES=dynamodb,s3,lambda,sqs,apigateway,iam
    depends_on:
      ministack:
        condition: service_healthy
    restart: unless-stopped
