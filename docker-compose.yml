# Local AWS emulator + observability for Gatehold.
# https://github.com/ministackorg/ministack
#
# Start:  npm run ministack:up
# Health: npm run ministack:health
# Reset:  npm run ministack:reset
# UI:     http://localhost:8080  (StackPort)
# Pay:    http://localhost:8090  (mock-payment; Lambdas use host.docker.internal:8090)

services:
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    environment:
      - MINISTACK_REGION=us-east-1
      - MINISTACK_ACCOUNT_ID=000000000000
      # docker = run Lambdas in containers (needed for non-Python runtimes)
      - LAMBDA_EXECUTOR=docker
      - LOG_LEVEL=INFO
    volumes:
      # Required so MiniStack can start Lambda containers
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # DynamoDB / Lambda / SQS / Logs / Step Functions browser — StackPort
  # https://stackport.cloud/docs/guides/ministack/
  #
  # NOT a second DynamoDB. Points at MiniStack on :4566.
  # Open: http://localhost:8080
  # ---------------------------------------------------------------------------
  stackport:
    image: davireis/stackport:latest
    ports:
      - "8080:8080"
    environment:
      - AWS_ENDPOINT_URL=http://ministack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      # Probe services we use locally (Phase 0–9a).
      # Cognito UI key is cognito-idp (not "cognito") — see StackPort STACKPORT_SERVICES.
      - STACKPORT_SERVICES=dynamodb,s3,lambda,sqs,sns,ses,apigateway,iam,stepfunctions,logs,events,scheduler,cognito-idp
    depends_on:
      ministack:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mock payment (Phase 5+) — required for purchase saga authorize/capture.
  # Host port 8090; saga Lambdas call http://host.docker.internal:8090
  # ---------------------------------------------------------------------------
  mock-payment:
    build:
      context: ./go
      dockerfile: mock-payment/Dockerfile
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
    restart: unless-stopped
