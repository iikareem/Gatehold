$kind: collection
name: Gatehold
description: |-
  Phase 0–1 local MiniStack API (health + single-seat hold).

  Setup:
  1. Select environment "Gatehold MiniStack"
  2. Use Desktop Agent (not Cloud)
  3. After redeploy, refresh gatewayBase from .cdk-outputs.json
  4. Run requests 1 → 7 in order

  Docs: docs/api.md
variables:
  - key: gatewayBase
    value: '{{gatewayBase}}'
    description: Overridden by environment
order: 1000
