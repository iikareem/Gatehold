$kind: http-request
name: '3. Hold — single seat (201)'
method: POST
url: '{{gatewayBase}}/events/{{eventId}}/holds'
headers:
  - key: Content-Type
    value: application/json
  - key: X-User-Id
    value: '{{userId}}'
body:
  type: json
  content: |-
    {
      "seatIds": ["{{seatId}}"]
    }
order: 3000
